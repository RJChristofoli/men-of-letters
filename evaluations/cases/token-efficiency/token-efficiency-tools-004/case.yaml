schema_version: 1
id: token-efficiency-tools-004
capability: token-efficiency
kind: positive
gate_dimensions: [adverse-or-ambiguous]
preference_review: not-required
prompt_file: prompt.md
output_schema: output.schema.json
workspace_fixture: workspace
sandbox: read-only
checks:
  required_nonempty: [component_status, blocker, next_action]
  minimum_items: {}
  required_terms:
    - path: decision
      terms: [blocked]
