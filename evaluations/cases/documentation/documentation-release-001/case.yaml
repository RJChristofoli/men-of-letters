schema_version: 1
id: documentation-release-001
capability: documentation
kind: positive
gate_dimensions: [primary-rule]
preference_review: not-required
prompt_file: prompt.md
output_schema: ../decision.schema.json
sandbox: read-only
checks:
  required_nonempty: [changes, excluded_claims, verification]
  minimum_items:
    changes: 2
    excluded_claims: 1
    verification: 3
  required_terms:
    - path: artifact_language
      terms: [english]
    - path: entry_doc_action
      terms: [concise-update]
    - path: changes
      terms: [doctor, exit]
    - path: excluded_claims
      terms: [repair]
    - path: verification
      terms: [link, status]
