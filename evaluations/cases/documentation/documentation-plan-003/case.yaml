schema_version: 1
id: documentation-plan-003
capability: documentation
kind: positive
gate_dimensions: [adverse-or-ambiguous]
preference_review: required
prompt_file: prompt.md
output_schema: ../decision.schema.json
sandbox: read-only
checks:
  required_nonempty: [excluded_claims, verification]
  minimum_items:
    excluded_claims: 2
    verification: 2
  required_terms:
    - path: artifact_language
      terms: [english]
    - path: implementation_status
      terms: [planned]
    - path: entry_doc_action
      terms: [no-change]
    - path: excluded_claims
      terms: [released, supported]
    - path: verification
      terms: [implementation, release]
