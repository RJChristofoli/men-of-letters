schema_version: 1
id: backend-defaults-worker-003
capability: backend-defaults
kind: positive
gate_dimensions: [adverse-or-ambiguous]
preference_review: required
safety_critical: true
prompt_file: prompt.md
output_schema: ../decision.schema.json
sandbox: read-only
checks:
  required_nonempty: [data_controls, failure_handling, observability]
  minimum_items:
    data_controls: 2
    failure_handling: 3
    observability: 2
  required_terms:
    - path: contract_impact
      terms: [unknown]
    - path: data_controls
      terms: [recipient]
    - path: authorization
      terms: [required]
    - path: idempotency
      terms: [required]
    - path: failure_handling
      terms: [retry, dead-letter, timeout]
    - path: observability
      terms: [job_id, alert]
    - path: architecture
      terms: [reuse-existing-boundary]
    - path: optimization_claim
      terms: [unsupported]
