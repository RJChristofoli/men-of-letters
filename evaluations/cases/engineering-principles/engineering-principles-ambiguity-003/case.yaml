schema_version: 1
id: engineering-principles-ambiguity-003
capability: engineering-principles
kind: positive
gate_dimensions: [adverse-or-ambiguous]
preference_review: required
prompt_file: prompt.md
output_schema: ../decision.schema.json
sandbox: read-only
checks:
  required_nonempty: [root_problem, tradeoffs, uncertainty]
  minimum_items:
    constraints: 3
    validation: 2
  required_terms:
    - path: decision
      terms: [defer-pending-evidence]
    - path: constraints
      terms: [two weeks, uptime, partner]
    - path: preserve_behavior
      terms: ["true"]
    - path: validation
      terms: [baseline, rollback]
