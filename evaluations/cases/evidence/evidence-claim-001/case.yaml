schema_version: 1
id: evidence-claim-001
capability: evidence
kind: positive
gate_dimensions: [primary-rule]
preference_review: not-required
prompt_file: prompt.md
output_schema: output.schema.json
sandbox: read-only
checks:
  required_nonempty:
    - limitations
    - next_action
  minimum_items:
    limitations: 2
  required_terms:
    - path: status
      terms: [partially-supported]
    - path: evidence_class
      terms: [measured]
    - path: observed_reduction_percent
      terms: ["27"]
    - path: next_action
      terms: [repeat, correctness]
