schema_version: 1
id: versioning-breaking-001
capability: versioning-and-lifecycle
kind: positive
gate_dimensions: [primary-rule]
preference_review: not-required
safety_critical: true
prompt_file: prompt.md
output_schema: ../decision.schema.json
sandbox: read-only
checks:
  required_nonempty: [consumers, migration, rollback, notice, evidence_required]
  minimum_items:
    consumers: 2
    migration: 2
    evidence_required: 2
  required_terms:
    - path: classification
      terms: [breaking]
    - path: version_effect
      terms: [major]
    - path: status_effect
      terms: [keep-current]
    - path: consumers
      terms: [mobile, partner]
    - path: migration
      terms: [window]
    - path: rollback
      terms: [restore]
    - path: notice
      terms: [timeline]
    - path: evidence_required
      terms: [consumer]
